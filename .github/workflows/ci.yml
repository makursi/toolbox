name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same ref makes a running job obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: format, docs, lint, types, test, build, e2e, hit areas
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # Installs pnpm (from `packageManager`) plus a Node.js runtime, then runs
      # `pnpm install`. The runtime must be spelled out: this repository has no
      # `devEngines.runtime` for the action to read, and pnpm's own binary does
      # not bring Node.js with it — every step below needs it on PATH.
      # CI matches local development on Node 24; `engines` only sets the floor.
      - uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true

      # Whole-repository format check, not a Turborepo task — see ADR 0002.
      - name: Format
        run: pnpm fmt:check

      # One README in two languages, compared structurally — the script explains
      # what it does read and what it deliberately does not. Then the instruments'
      # pointers, both directions, and their own falsification run: a script with
      # no section, or a section whose document moved, fails here rather than
      # going quiet in review.
      - name: Docs
        run: |
          pnpm check:readme
          pnpm check:docs
          pnpm check:docs --falsify

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # The browser the gate drives is a per-machine download; `pnpm install`
      # deliberately does not fetch it. Keyed on the lockfile, which is where the
      # Playwright version lives — a key that did not track it would serve
      # binaries the library no longer matches, which is worse than no cache.
      - name: Cache the gate's browser
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install the gate's browser
        run: pnpm --filter @toolbox/web exec playwright install --with-deps chromium

      # Against the build above: the `e2e` task depends on `build`, so Turborepo
      # serves it from its own cache instead of building a second time.
      - name: Browser gate
        run: pnpm e2e

      # The instrument, on the build the gate just drove. It is not a test case and
      # not a Turborepo task — it needs a server and a Chrome you started — but a
      # threshold nobody runs is not a check: this probe was found red on the cover
      # generator's page for five days, 406 failures, with nothing to say so
      # (apps/web/docs/design/log.md item 3, ADR 0012's update). The browser is the
      # one the gate already pinned, so the two tiers read the same engine major in
      # headless mode. They do not get the same *environment*: Playwright also pins
      # hover/pointer capability, scrollbars and timer throttling, and the probe sets
      # the media features it certifies itself (#84).
      #
      # `--no-sandbox` is not a shortcut: Chromium's own sandbox cannot start on this
      # runner (it aborts before it listens), and Playwright launches with
      # `chromiumSandbox: false` anyway — so this is the gate's own arrangement, not
      # a looser one. `--disable-dev-shm-usage` is the same story for shared memory.
      - name: Hit areas
        working-directory: apps/web
        run: |
          CHROME=$(node -p "require('@playwright/test').chromium.executablePath()")
          # A port of its own: a stray listener on the gate's would satisfy the
          # readiness wait below and then be measured instead of this build.
          PORT=3211
          pnpm exec next start -p "$PORT" > "$RUNNER_TEMP/server.log" 2>&1 &
          SERVER=$!
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage \
            --remote-debugging-port=9333 --user-data-dir="$(mktemp -d)" \
            --no-first-run about:blank > "$RUNNER_TEMP/chrome.log" 2>&1 &
          BROWSER=$!
          trap 'kill "$BROWSER" "$SERVER" 2>/dev/null || true' EXIT
          curl -sf --retry 30 --retry-delay 1 --retry-connrefused "http://127.0.0.1:$PORT/" > /dev/null
          curl -sf --retry 30 --retry-delay 1 --retry-connrefused http://127.0.0.1:9333/json/version > /dev/null
          # A background job that died during the wait is invisible to `bash -e`;
          # without this the probe fails with a connection error that blames the page.
          # The server must be alive; the browser only has to answer the port above —
          # Chrome detaches from the shell on some platforms, so its launcher being
          # gone is a note, not a failure (a browser that dies *later* is caught by the
          # instrument's own deadlines in `apps/web/scripts/cdp.mjs`).
          kill -0 "$SERVER" || { echo "next start is gone:"; cat "$RUNNER_TEMP/server.log"; exit 1; }
          kill -0 "$BROWSER" 2>/dev/null || { echo "the browser's launcher is gone; the debugging port answered, continuing"; cat "$RUNNER_TEMP/chrome.log"; }
          pnpm --filter @toolbox/web touch-targets "http://127.0.0.1:$PORT"
          # The Instrument's own guards, on the same build and the same browser: five
          # entries, five page loads, one green pass each — a guard that can no longer
          # fail is a guard that has stopped guarding (#109). What it exits 1 on is
          # stated once, in apps/web/docs/design/instruments.md.
          pnpm --filter @toolbox/web touch-targets --falsify "http://127.0.0.1:$PORT"
